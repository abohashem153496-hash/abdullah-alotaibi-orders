<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل بيانات الطلب</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .success-msg {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        .nav-links {
            text-align: center;
            margin-top: 20px;
        }
        .nav-links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>تسجيل بيانات الطلب</h2>
    <form id="dataForm">
        <div class="form-group">
            <label for="fullName">الاسم:</label>
            <input type="text" id="fullName" required placeholder="أدخل الاسم الكامل">
        </div>

        <div class="form-group">
            <label for="address">المكان (العنوان):</label>
            <input type="text" id="address" required placeholder="أدخل العنوان أو المكان">
        </div>

        <div class="form-group">
            <label for="carType">نوع العربية:</label>
            <input type="text" id="carType" required placeholder="أدخل نوع السيارة">
        </div>

        <div class="form-group">
            <label for="nationalityType">الإقامة / الجنسية:</label>
            <select id="nationalityType" required>
                <option value="">-- اختر الحالة --</option>
                <option value="سعودي">سعودي</option>
                <option value="مقيم">مقيم</option>
            </select>
        </div>

        <button type="submit">إرسال الطلب</button>
        <div id="successMsg" class="success-msg">تم إرسال الطلب وحفظه بنجاح!</div>
    </form>
    
    <div class="nav-links">
        <a href="control.html">الانتقال إلى لوحة التحكم والإعدادات &larr;</a>
    </div>
</div>

<script>
    document.getElementById('dataForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const newOrder = {
            id: Date.now(),
            name: document.getElementById('fullName').value,
            address: document.getElementById('address').value,
            car: document.getElementById('carType').value,
            nationality: document.getElementById('nationalityType').value,
            timestamp: new Date().toLocaleString('ar-SA', { 
                year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            })
        };

        let orders = JSON.parse(localStorage.getItem('control_orders')) || [];
        orders.unshift(newOrder);
        localStorage.setItem('control_orders', JSON.stringify(orders));

        const msg = document.getElementById('successMsg');
        msg.style.display = 'block';
        document.getElementById('dataForm').reset();

        setTimeout(() => {
            msg.style.display = 'none';
        }, 3500);
    });
</script>

</body>
</html>
