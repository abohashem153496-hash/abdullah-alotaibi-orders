<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wrapper {
            width: 100%;
            max-width: 700px;
        }
        .dashboard-header {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
        .dashboard-header h1 {
            font-size: 20px;
            color: #d4af37;
        }
        .back-btn {
            background: #1e1e1e;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
        .order-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .order-card-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            border-bottom: 1px dashed #262626;
            padding-bottom: 8px;
        }
        .order-card-body p {
            font-size: 14px;
            margin-bottom: 6px;
            color: #ddd;
        }
        .order-card-body span {
            color: #d4af37;
            font-weight: 600;
        }
        .order-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .wa-btn {
            background: #25d366;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .del-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            color: #777;
            padding: 40px;
            background: #141414;
            border-radius: 12px;
            border: 1px solid #262626;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="dashboard-header">
            <h1>لوحة التحكم - إدارة الطلبات</h1>
            <a href="index.html" class="back-btn">الذهاب للموقع</a>
        </div>

        <div id="ordersContainer">
            <div class="empty-state">جاري تحميل الطلبات من السحابة...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        // إعدادات فايربيس الخاصة بك (ضع نفس إعدادات مشروعك هنا)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Password Protection on Page Load
        window.onload = function() {
            const password = prompt("الرجاء إدخال كلمة المرور السرية للوصول إلى لوحة التحكم:");
            if (password === '1234' || password === 'admin') {
                listenToOrders();
            } else {
                alert("كلمة المرور غير صحيحة!");
                window.location.href = 'index.html';
            }
        };

        // جلب ومراقبة الطلبات لحظياً من قاعدة بيانات Firebase السحابية
        function listenToOrders() {
            const container = document.getElementById('ordersContainer');
            const ordersRef = database.ref('orders');

            ordersRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (!data) {
                    container.innerHTML = '<div class="empty-state">لا توجد طلبات مسجلة حتى الآن.</div>';
                    return;
                }

                // تحويل الكائن القادم من قاعدة البيانات إلى مصفوفة وترتيبها من الأحدث للأقدم
                let orders = [];
                for (let key in data) {
                    orders.push(data[key]);
                }
                orders.sort((a, b) => b.id - a.id);

                let html = '';
                orders.forEach((ord, index) => {
                    const waMessage = `طلب جديد رقم #${ord.orderNumber}%0a- الاسم: ${ord.fullName}%0a- الجوال: ${ord.phone}%0a- المدينة: ${ord.city}%0a- السيارة: ${ord.carModel}%0a- نوع العميل: ${ord.clientType}%0a- الدفع: ${ord.payMethod}%0a- الوقت: ${ord.date}`;
                    
                    html += `
                        <div class="order-card">
                            <div class="order-card-header">
                                <span>طلب رقم #${ord.orderNumber} (ترتيب: ${index + 1})</span>
                                <span>${ord.date}</span>
                            </div>
                            <div class="order-card-body">
                                <p>الاسم: <span>${ord.fullName}</span></p>
                                <p>الجوال: <span>${ord.phone}</span></p>
                                <p>المدينة: <span>${ord.city}</span></p>
                                <p>السيارة المطلوبة: <span>${ord.carModel}</span></p>
                                <p>نوع العميل: <span>${ord.clientType}</span> | طريقة الدفع: <span>${ord.payMethod}</span></p>
                            </div>
                            <div class="order-actions">
                                <a href="https://wa.me/?text=${waMessage}" target="_blank" class="wa-btn">إرسال للواتساب</a>
                                <button class="del-btn" onclick="deleteOrder(${ord.id})">حذف الطلب</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        function deleteOrder(id) {
            if (confirm("هل أنت متأكد من حذف هذا الطلب نهائياً من السحابة؟")) {
                database.ref('orders/' + id).remove()
                    .catch((error) => {
                        alert("حدث خطأ أثناء الحذف.");
                        console.error(error);
                    });
            }
        }
    </script>
</body>
</html>
