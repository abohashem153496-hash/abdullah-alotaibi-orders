<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            min-height: 100vh;
            padding: 20px;
        }
        /* Login Screen */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #141414;
            border: 1px solid #262626;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
        }
        .login-input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 15px;
            outline: none;
        }
        .login-input:focus {
            border-color: #d4af37;
        }
        .login-btn {
            width: 100%;
            background: #d4af37;
            color: #0b0b0b;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #e5c158;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Dashboard Content */
        .dashboard {
            display: none;
            max-width: 1000px;
            margin: 0 auto;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid #262626;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }
        .dashboard-title {
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
        }
        .logout-btn {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.2);
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-right: 4px solid #d4af37;
        }
        .order-id {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .order-detail {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .order-detail span {
            color: #fff;
            font-weight: 600;
        }
        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #222;
        }
        .whatsapp-btn {
            flex: 1;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s;
        }
        .whatsapp-btn:hover {
            background: rgba(46, 204, 113, 0.2);
        }
        .delete-btn {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .delete-btn:hover {
            background: rgba(231, 76, 60, 0.2);
        }
        .no-orders {
            text-align: center;
            color: #666;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-wrapper" id="loginScreen">
        <div class="login-box">
            <h2 class="login-title">لوحة تحكم الإدارة</h2>
            <input type="password" id="passcode" class="login-input" placeholder="••••" maxlength="4">
            <button class="login-btn" onclick="checkPassword()">دخول</button>
            <div class="error-msg" id="errorMsg">كلمة المرور غير صحيحة</div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div class="dashboard" id="dashboardScreen">
        <div class="dashboard-header">
            <h1 class="dashboard-title">الطلبات الواردة لحظياً</h1>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
        <div class="orders-grid" id="ordersContainer">
            <div class="no-orders">جاري تحميل الطلبات...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIme1Li9x-ykLXMNKKnWD-Zwtsjr8Lio",
            authDomain: "car-orders.firebaseapp.com",
            databaseURL: "https://car-orders-default-rtdb.firebaseio.com",
            projectId: "car-orders",
            storageBucket: "car-orders.appspot.com",
            messagingSenderId: "301308342917",
            appId: "1:301308342917:web:df82c7a935891f60502fec"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function checkPassword() {
            const pass = document.getElementById('passcode').value;
            if (pass === '1234') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                loadOrders();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // Allow enter key for login
        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        function logout() {
            location.reload();
        }

        function loadOrders() {
            const ordersRef = database.ref('orders');
            ordersRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('ordersContainer');
                container.innerHTML = '';

                if (!data) {
                    container.innerHTML = '<div class="no-orders">لا توجد طلبات جديدة حتى الآن</div>';
                    return;
                }

                Object.keys(data).reverse().forEach(key => {
                    const order = data[key];
                    const phoneClean = order.phone.startsWith('0') ? '966' + order.phone.substring(1) : order.phone;
                    const waText = `مرحباً ${order.fullName}، بخصوص طلبك لسيارة ${order.carModel} في معرضنا، نحن نتواصل معك...`;
                    const waLink = `https://wa.me/${phoneClean}?text=${encodeURIComponent(waText)}`;

                    const card = document.createElement('div');
                    card.className = 'order-card';
                    card.innerHTML = `
                        <div class="order-id">
                            <span>طلب #${order.orderNumber || key}</span>
                            <span>${order.date}</span>
                        </div>
                        <div class="order-detail">نوع العميل: <span>${order.clientType}</span></div>
                        <div class="order-detail">طريقة الدفع: <span>${order.payMethod}</span></div>
                        <div class="order-detail">الاسم: <span>${order.fullName}</span></div>
                        <div class="order-detail">الجوال: <span>${order.phone}</span></div>
                        <div class="order-detail">المدينة: <span>${order.city}</span></div>
                        <div class="order-detail">السيارة: <span>${order.carModel}</span></div>
                        <div class="card-actions">
                            <a href="${waLink}" target="_blank" class="whatsapp-btn">مراسلة واتساب</a>
                            <button class="delete-btn" onclick="deleteOrder('${key}')">حذف</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function deleteOrder(orderKey) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                database.ref('orders/' + orderKey).remove();
            }
        }
    </script>
</body>
</html>
