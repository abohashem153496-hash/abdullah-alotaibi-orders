<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهل كار - لوحة تحكم الإدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #f1f1f1;
            min-height: 100vh;
            padding: 20px;
        }
        /* Login Screen */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            background: #141414;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .login-title {
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
            margin-bottom: 20px;
        }
        .login-input {
            width: 100%;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 15px;
            color: #fff;
            font-size: 16px;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 15px;
            outline: none;
        }
        .login-input:focus {
            border-color: #d4af37;
        }
        .login-btn {
            width: 100%;
            background: #d4af37;
            color: #0b0b0b;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #e5c158;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* Dashboard Content */
        .dashboard {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .dashboard-title {
            font-size: 20px;
            font-weight: 700;
            color: #d4af37;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #d4af37;
            color: #0b0b0b;
            border-color: #d4af37;
        }
        .logout-btn {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.2);
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-right: 4px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .order-card.archived {
            border-right-color: #3498db;
        }
        .order-card.contacted {
            border-right-color: #2ecc71;
        }
        .order-id {
            font-size: 13px;
            color: #888;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 5px;
            background: #222;
            color: #d4af37;
            font-weight: 700;
        }
        .order-detail {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .order-detail span {
            color: #fff;
            font-weight: 600;
        }
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #222;
        }
        .action-row {
            display: flex;
            gap: 8px;
        }
        .btn-action {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border: none;
            text-decoration: none;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn-action:hover {
            opacity: 0.85;
        }
        .whatsapp-btn { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; color: #2ecc71; }
        .contact-btn { background: rgba(241, 196, 15, 0.15); border: 1px solid #f1c40f; color: #f1c40f; }
        .archive-btn { background: rgba(52, 152, 219, 0.15); border: 1px solid #3498db; color: #3498db; }
        .delete-btn { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; color: #e74c3c; }

        .no-orders {
            text-align: center;
            color: #666;
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 16px;
            background: #141414;
            border-radius: 15px;
            border: 1px solid #262626;
        }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div class="login-wrapper" id="loginScreen">
        <div class="login-box">
            <h2 class="login-title">أهل كار - لوحة الإدارة</h2>
            <input type="password" id="passcode" class="login-input" placeholder="••••" maxlength="4">
            <button class="login-btn" onclick="checkPassword()">دخول</button>
            <div class="error-msg" id="errorMsg">كلمة المرور غير صحيحة</div>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div class="dashboard" id="dashboardScreen">
        <div class="dashboard-header">
            <h1 class="dashboard-title">إدارة طلبات أهل كار</h1>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('all', this)">الطلبات الجديدة</button>
                <button class="tab-btn" onclick="switchTab('contacted', this)">تم التواصل</button>
                <button class="tab-btn" onclick="switchTab('archived', this)">الأرشيف (المحفوظات)</button>
            </div>
            <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
        </div>
        <div class="orders-grid" id="ordersContainer">
            <div class="no-orders">جاري تحميل الطلبات...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIme1Li9x-ykLXMNKKnWD-Zwtsjr8Lio",
            authDomain: "car-orders.firebaseapp.com",
            databaseURL: "https://car-orders-default-rtdb.firebaseio.com",
            projectId: "car-orders",
            storageBucket: "car-orders.appspot.com",
            messagingSenderId: "301308342917",
            appId: "1:301308342917:web:df82c7a935891f60502fec"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentFilter = 'all'; // all, contacted, archived
        let allOrdersData = {};

        function checkPassword() {
            const pass = document.getElementById('passcode').value;
            if (pass === '1234') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                loadOrders();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        document.getElementById('passcode').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkPassword();
        });

        function logout() {
            location.reload();
        }

        function switchTab(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderOrders();
        }

        function loadOrders() {
            const ordersRef = database.ref('orders');
            ordersRef.on('value', (snapshot) => {
                allOrdersData = snapshot.val() || {};
                renderOrders();
            });
        }

        function renderOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            const keys = Object.keys(allOrdersData).reverse();
            let filteredKeys = keys.filter(key => {
                const order = allOrdersData[key];
                const status = order.status || 'جديد';
                if (currentFilter === 'all') return status !== 'أرشيف';
                if (currentFilter === 'contacted') return status === 'تم التواصل';
                if (currentFilter === 'archived') return status === 'أرشيف';
                return true;
            });

            if (filteredKeys.length === 0) {
                container.innerHTML = '<div class="no-orders">لا توجد طلبات في هذا القسم حالياً</div>';
                return;
            }

            filteredKeys.forEach(key => {
                const order = allOrdersData[key];
                const status = order.status || 'جديد';
                
                // صياغة رسالة الواتساب المتكاملة لأهل كار
                const messageText = `🚗 طلب جديد من معرض أهل كار:\n\n` +
                    `📋 رقم الطلب: #${order.orderNumber || key}\n` +
                    `👤 اسم العميل: ${order.fullName}\n` +
                    `📱 الجوال: ${order.phone}\n` +
                    `📍 المدينة: ${order.city}\n` +
                    `🚘 السيارة: ${order.carModel}\n` +
                    `🔹 نوع العميل: ${order.clientType}\n` +
                    `💳 طريقة الدفع: ${order.payMethod}\n` +
                    `⏱️ الوقت: ${order.date}`;

                const card = document.createElement('div');
                card.className = `order-card ${status === 'أرشيف' ? 'archived' : (status === 'تم التواصل' ? 'contacted' : '')}`;
                card.innerHTML = `
                    <div>
                        <div class="order-id">
                            <span>طلب #${order.orderNumber || key}</span>
                            <span class="status-badge">${status}</span>
                        </div>
                        <div class="order-detail">نوع العميل: <span>${order.clientType}</span></div>
                        <div class="order-detail">طريقة الدفع: <span>${order.payMethod}</span></div>
                        <div class="order-detail">الاسم: <span>${order.fullName}</span></div>
                        <div class="order-detail">الجوال: <span>${order.phone}</span></div>
                        <div class="order-detail">المدينة: <span>${order.city}</span></div>
                        <div class="order-detail">السيارة: <span>${order.carModel}</span></div>
                    </div>

                    <div class="card-actions">
                        <div class="action-row">
                            <a href="https://wa.me/?text=${encodeURIComponent(messageText)}" target="_blank" class="btn-action whatsapp-btn">
                                تحويل لواتساب
                            </a>
                            <button class="btn-action contact-btn" onclick="updateStatus('${key}', 'تم التواصل')">
                                تم التواصل
                            </button>
                        </div>
                        <div class="action-row">
                            <button class="btn-action archive-btn" onclick="updateStatus('${key}', 'أرشيف')">
                                أرشفة / حفظ
                            </button>
                            <button class="btn-action delete-btn" onclick="deleteOrder('${key}')">
                                حذف
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateStatus(key, newStatus) {
            database.ref('orders/' + key).update({ status: newStatus }, (error) => {
                if (error) alert('حدث خطأ أثناء تحديث حالة الطلب');
            });
        }

        function deleteOrder(orderKey) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب نهائياً؟')) {
                database.ref('orders/' + orderKey).remove();
            }
        }
    </script>
</body>
</html>
